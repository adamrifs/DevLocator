<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample 1: React Application</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 18px; margin-bottom: 20px; }
    .btn { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    input { background: #0f172a; border: 1px solid #334155; color: white; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; }
    .item { padding: 8px; background: #0f172a; margin-bottom: 6px; border-radius: 4px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function Navbar({ title }) {
      return (
        <header className="card" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <h2 style={{ margin: 0, color: '#38bdf8' }}>{title}</h2>
          <span style={{ fontSize: '12px', background: '#0369a1', padding: '4px 8px', borderRadius: '4px' }}>React 18</span>
        </header>
      );
    }

    function SubmitButton({ label }) {
      return (
        <button id="react-submit-btn" className="btn" type="submit">
          {label}
        </button>
      );
    }

    function LoginForm() {
      const [email, setEmail] = React.useState('');
      return (
        <div id="login-form-wrapper" className="card">
          <h3>User Authentication</h3>
          <form onSubmit={(e) => e.preventDefault()} style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
            <label>Email Address</label>
            <input
              id="react-email-input"
              type="email"
              value={email}
              placeholder="user@example.com"
              onChange={(e) => setEmail(e.target.value)}
            />
            <div>
              <SubmitButton label="Sign In" />
            </div>
          </form>
        </div>
      );
    }

    function TaskItem({ text, completed }) {
      return (
        <li className="item">
          <span>{text}</span>
          <span style={{ color: completed ? '#10b981' : '#f59e0b' }}>
            {completed ? 'Complete' : 'Pending'}
          </span>
        </li>
      );
    }

    function TaskList() {
      const tasks = [
        { id: 1, text: 'Detect React Fiber instance', completed: true },
        { id: 2, text: 'Resolve component hierarchy', completed: true },
        { id: 3, text: 'Extract development source info', completed: true },
      ];

      return (
        <div className="card">
          <h3>Component Task List</h3>
          <ul style={{ listStyle: 'none', padding: 0, margin: 0 }}>
            {tasks.map((task) => (
              <TaskItem key={task.id} text={task.text} completed={task.completed} />
            ))}
          </ul>
        </div>
      );
    }

    function App() {
      return (
        <div className="container">
          <Navbar title="DevLocator React Test Application" />
          <LoginForm />
          <TaskList />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
